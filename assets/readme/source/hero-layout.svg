<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">酒馆角色卡分类与审计工具</title>
  <desc id="desc">酒馆档案管理员将角色卡沿分类路径放入档案抽屉，左侧展示项目名称与已验收数据。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171310"/><stop offset="0.62" stop-color="#0f0d0c"/><stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="subject-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f0d0c"/><stop offset="0.18" stop-color="#0f0d0c" stop-opacity="0.54"/><stop offset="0.42" stop-color="#0f0d0c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ember" cx="72%" cy="46%" r="52%">
      <stop offset="0" stop-color="#c29a5b" stop-opacity="0.17"/><stop offset="0.5" stop-color="#c51d24" stop-opacity="0.08"/><stop offset="1" stop-color="#0f0d0c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvas-clip"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="420" fill="url(#background)"/><rect width="1200" height="420" fill="url(#ember)"/>
    <g id="branching-motif" fill="none" stroke="#c51d24" stroke-width="3" opacity="0.32">
      <path d="M0 350H34L58 326H94"/><path d="M34 350L58 374H112"/><path d="M1100 56H1135L1160 31H1200"/><path d="M1135 56L1160 82H1200"/>
      <circle cx="94" cy="326" r="5" fill="#c51d24"/><circle cx="112" cy="374" r="5" fill="#c51d24"/>
    </g>
    <g id="generated-subject">
      <image x="625" y="-14" width="610" height="458" xlink:href="./hero-subject.png" preserveAspectRatio="xMidYMid meet"/>
      <rect x="560" y="0" width="370" height="420" fill="url(#subject-fade)"/>
    </g>
    <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <image x="60" y="38" width="78" height="72" xlink:href="./st-pattern-logo.png" preserveAspectRatio="xMidYMid meet"/>
      <text x="154" y="67" fill="#c29a5b" font-size="17" font-weight="700" letter-spacing="2.4">SILLYTAVERN · LOCAL ARCHIVE PIPELINE</text>
      <text x="154" y="94" fill="#9e9387" font-size="16">COLLECT · AUDIT · CLASSIFY · APPROVE</text>
      <text x="60" y="171" fill="#f2e9d8" font-family="'Microsoft YaHei', 'Microsoft JhengHei', 'DengXian', sans-serif" font-size="58" font-weight="700" letter-spacing="1">酒馆角色卡</text>
      <text x="60" y="232" fill="#f2e9d8" font-family="'Microsoft YaHei', 'Microsoft JhengHei', 'DengXian', sans-serif" font-size="58" font-weight="700" letter-spacing="1">分类与审计工具</text>
      <path d="M60 259H112" stroke="#c51d24" stroke-width="5" stroke-linecap="round"/><path d="M125 259H565" stroke="#4d3c32" stroke-width="1"/>
      <text x="60" y="293" fill="#d7cbbb" font-size="22">把散乱收藏整理成可审计、可批准、可追溯的分类副本</text>
      <g id="proof" transform="translate(60 331)">
        <g><text x="0" y="0" fill="#f2e9d8" font-size="29" font-weight="750">15,134</text><text x="0" y="25" fill="#9e9387" font-size="16">有效角色卡</text></g>
        <path d="M153 -9V28" stroke="#4d3c32"/>
        <g transform="translate(178 0)"><text x="0" y="0" fill="#f2e9d8" font-size="29" font-weight="750">15,134</text><text x="0" y="25" fill="#9e9387" font-size="16">成功复制</text></g>
        <path d="M331 -9V28" stroke="#4d3c32"/>
        <g transform="translate(356 0)"><text x="0" y="0" fill="#f2e9d8" font-size="29" font-weight="750">0</text><text x="0" y="25" fill="#9e9387" font-size="16">哈希多重集差异</text></g>
      </g>
      <text x="60" y="397" fill="#73685f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">VERIFIED BATCH · 2026-08-29</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" fill="none" stroke="#4d3c32" stroke-width="1.5"/>
</svg>
